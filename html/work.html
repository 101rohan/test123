<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Featured Work</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="/css/work.css">
</head>

<body>

  <div class="scroll-viewport" id="scrollViewport">

    <section class="work">

      <div class="work-inner">

        <div class="work-header">
          <h1>Featured Work</h1>
          <p>Tiny fraction of my work</p>
        </div>

        <div class="work-layout" id="workLayout">

          <!-- LEFT -->
          <div class="project-list">

            <div class="project active">
              <span>Project 1</span>
              <a href="#">see more.</a>
            </div>

            <div class="project">
              <span>Project 2</span>
              <a href="#">see more.</a>
            </div>

            <div class="project">
              <span>Project 3</span>
              <a href="#">see more.</a>
            </div>

            <div class="project">
              <span>Project 4</span>
              <a href="#">see more.</a>
            </div>

            <div class="project">
              <span>Project 5</span>
              <a href="#">see more.</a>
            </div>

          </div>

          <!-- CENTER -->
          <div class="stack-container">

            <div class="stack-inner">

              <div class="stack-card" data-card="4">
                <img src="/assets/1.png" alt="">
                <div class="card-info">
                  <h3>Campaign<br>Design</h3>
                  <span>2024</span>
                </div>
              </div>

              <div class="stack-card" data-card="3">
                <img src="/assets/2.png" alt="">
                <div class="card-info">
                  <h3>Brand<br>Identity</h3>
                  <span>2024</span>
                </div>
              </div>

              <div class="stack-card" data-card="2">
                <img src="/assets/3.png" alt="">
                <div class="card-info">
                  <h3>Motion<br>Graphics</h3>
                  <span>2023</span>
                </div>
              </div>

              <div class="stack-card" data-card="1">
                <img src="/assets/4.png" alt="">
                <div class="card-info">
                  <h3>Web<br>Design</h3>
                  <span>2023</span>
                </div>
              </div>

              <div class="stack-card" data-card="0">
                <img src="/assets/5.png" alt="">
                <div class="card-info">
                  <h3>Branding<br>System</h3>
                  <span>2023</span>
                </div>
              </div>

            </div>

          </div>

          <!-- RIGHT -->
          <div class="thumbs">

            <div class="thumb active">
              <img src="/assets/1.png" alt="">
            </div>

            <div class="thumb">
              <img src="/assets/2.png" alt="">
            </div>

            <div class="thumb">
              <img src="/assets/3.png" alt="">
            </div>

            <div class="thumb">
              <img src="/assets/4.png" alt="">
            </div>

            <div class="thumb">
              <img src="/assets/5.png" alt="">
            </div>

          </div>

        </div>

      </div>

    </section>

  </div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lenis@1.1.14/dist/lenis.min.js"></script>

<script src="/js/work.js"></script>

</body>
</html>
